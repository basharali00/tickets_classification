x-app: &app
  restart: unless-stopped
  image: tickets:local
  build:
    context: .
    target: local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  api:
    <<: *app
    ports:
      - "8000:80"

  celery_worker:
    <<: *app
    command: celery -A packages.main_celery worker -c 2 --loglevel=info

  celery_beat:
    <<: *app
    command: celery -A packages.beat beat -s /tmp/celerybeat-schedule --loglevel=info

  pytest:
    <<: *app
    restart: "no"
    image: tickets:test
    build:
      context: .
      target: test
    command: pytest -x
    environment:
      PYTEST_ADDOPTS: "--color=yes"
    profiles: ["test"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    command: -c fsync=off # faster local/test runs; not for production
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tickets", "-d", "tickets"]
      interval: 2s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
